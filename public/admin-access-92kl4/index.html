<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      window.CMS_MANUAL_INIT = true;
      
      const initCMS = () => {
        CMS.init({
          config: {
            backend: {
              name: 'github',
              repo: 'szantodenis1/topsoundupgrade2',
              branch: 'main',
              base_url: 'https://api.netlify.com',
              auth_endpoint: 'https://topsoundupgrade.eu.auth0.com/authorize',
              app_id: 'LTCPh4oMv06vogNjg1BC2AuyvxqepV1B'
            },
            media_folder: "public/uploads",
            public_folder: "/uploads",
            collections: [
              {
                name: "settings",
                label: "Site Settings",
                files: [
                  {
                    name: "general",
                    label: "Site Settings",
                    file: "content/settings/general.json",
                    fields: [
                      { label: "Site Title", name: "siteTitle", widget: "string" },
                      { label: "Site Description", name: "siteDescription", widget: "text" },
                      {
                        label: "SEO Settings",
                        name: "seo",
                        widget: "object",
                        fields: [
                          { label: "Meta Title", name: "metaTitle", widget: "string" },
                          { label: "Meta Description", name: "metaDescription", widget: "text" },
                          { label: "Open Graph Image", name: "ogImage", widget: "image" }
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                name: "home",
                label: "Homepage",
                files: [
                  {
                    name: "hero",
                    label: "Hero Section",
                    file: "content/home/hero.json",
                    fields: [
                      { label: "Title", name: "title", widget: "string" },
                      { label: "Subtitle", name: "subtitle", widget: "text" },
                      { label: "CTA Text", name: "ctaText", widget: "string" },
                      { label: "Background Image", name: "backgroundImage", widget: "image" }
                    ]
                  },
                  {
                    name: "about",
                    label: "About Section",
                    file: "content/home/about.json",
                    fields: [
                      { label: "Title", name: "title", widget: "string" },
                      { label: "Description 1", name: "description1", widget: "text" },
                      { label: "Description 2", name: "description2", widget: "text" },
                      { label: "Description 3", name: "description3", widget: "text" },
                      { label: "CTA Text", name: "ctaText", widget: "string" },
                      { label: "Image", name: "image", widget: "image" }
                    ]
                  }
                ]
              },
              {
                name: "services",
                label: "Services",
                folder: "content/services",
                create: true,
                fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Description", name: "description", widget: "text" },
                  { label: "Icon Type", name: "iconType", widget: "select", options: ["Music4", "SpotlightIcon", "LayoutGrid", "MonitorPlay", "Wrench"] },
                  {
                    label: "Details",
                    name: "details",
                    widget: "object",
                    fields: [
                      { label: "Main Text", name: "mainText", widget: "text" },
                      { label: "Bullet Points", name: "bulletPoints", widget: "list", required: false },
                      { label: "Brands", name: "brands", widget: "text", required: false }
                    ]
                  }
                ]
              },
              {
                name: "testimonials",
                label: "Testimonials",
                folder: "content/testimonials",
                create: true,
                fields: [
                  { label: "Name", name: "name", widget: "string" },
                  { label: "Role", name: "role", widget: "string" },
                  { label: "Content", name: "content", widget: "text" },
                  { label: "Rating", name: "rating", widget: "number", min: 1, max: 5, value_type: "int" }
                ]
              },
              {
                name: "contact",
                label: "Contact Information",
                files: [
                  {
                    name: "info",
                    label: "Contact Info",
                    file: "content/contact/info.json",
                    fields: [
                      { label: "Phone", name: "phone", widget: "string" },
                      { label: "Email", name: "email", widget: "string" },
                      { label: "Address", name: "address", widget: "string" }
                    ]
                  }
                ]
              }
            ]
          }
        });
      };

      window.addEventListener('load', initCMS);
    </script>
  </body>
</html>
